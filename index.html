<!doctype html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>המרחב שפ״ח</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&display=swap">
<style>
/* Layout: a single phone-width column (max 480px) with a sticky station header, a fixed 5-tab bottom bar and bottom sheets for every form. */
:root{
  --bg:#EDF2F0; --surface:#FFFFFF; --surface-2:#F5F8F7; --ink:#13282C; --muted:#5A6D6F; --line:#D7E2DF;
  --accent:#0D6B66; --accent-ink:#FFFFFF; --accent-soft:#D5ECE7;
  --sun:#D9952A; --sun-soft:#FBEACB; --rose:#C4513A; --rose-soft:#F7DCD4; --ok:#2E8B57; --ok-soft:#D9F0E2;
  --c-office:#0D6B66; --c-field:#3B6CB0; --c-home:#7657A8; --c-course:#2C93A3; --c-emergency:#C4513A;
  --c-vacation:#D9952A; --c-sick:#B4436C; --c-childsick:#D06D93; --c-reserve:#5F7B35; --c-maternity:#9A5BB5;
  --shadow:0 1px 2px rgba(19,40,44,.06),0 8px 24px rgba(19,40,44,.07);
  --f-display:"Frank Ruhl Libre","David Libre","Times New Roman",serif;
  --f-body:"IBM Plex Sans Hebrew","Rubik","Arial Hebrew",Arial,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C181A; --surface:#132326; --surface-2:#182C2F; --ink:#E2EDEB; --muted:#93A8A8; --line:#24393C;
  --accent:#52B9AE; --accent-ink:#06211E; --accent-soft:#163B37;
  --sun:#EDB45A; --sun-soft:#3A2D16; --rose:#E77E67; --rose-soft:#3C221C; --ok:#5CC28A; --ok-soft:#173326;
  --c-office:#52B9AE; --c-field:#6F9BDB; --c-home:#A68BD6; --c-course:#5BC0CF; --c-emergency:#E77E67;
  --c-vacation:#EDB45A; --c-sick:#DE7AA0; --c-childsick:#EBA0BC; --c-reserve:#9DBB6B; --c-maternity:#C690DC;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0C181A; --surface:#132326; --surface-2:#182C2F; --ink:#E2EDEB; --muted:#93A8A8; --line:#24393C;
  --accent:#52B9AE; --accent-ink:#06211E; --accent-soft:#163B37;
  --sun:#EDB45A; --sun-soft:#3A2D16; --rose:#E77E67; --rose-soft:#3C221C; --ok:#5CC28A; --ok-soft:#173326;
  --c-office:#52B9AE; --c-field:#6F9BDB; --c-home:#A68BD6; --c-course:#5BC0CF; --c-emergency:#E77E67;
  --c-vacation:#EDB45A; --c-sick:#DE7AA0; --c-childsick:#EBA0BC; --c-reserve:#9DBB6B; --c-maternity:#C690DC;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
#app{max-width:480px;margin:0 auto;min-height:100%;position:relative}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;align-items:center;gap:12px}
.brand{display:flex;flex-direction:column;line-height:1.1;flex:1;min-width:0}
.brand b{font-family:var(--f-display);font-size:22px;font-weight:700;letter-spacing:-.2px}
.brand span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{position:relative;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}
.badge{position:absolute;top:-4px;left:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--rose);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--accent-soft);color:var(--accent);border:0}
.demo{background:var(--sun-soft);color:var(--ink);font-size:12px;text-align:center;padding:5px 16px;border-bottom:1px solid var(--line)}

main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:22px}
.view-title{font-family:var(--f-display);font-size:28px;font-weight:700;line-height:1.15}
.sub{color:var(--muted);font-size:13px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec-h h2{font-size:17px;font-weight:700}
.link{background:none;border:0;color:var(--accent);font-weight:600;font-size:13px;padding:4px 0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card.raised{box-shadow:var(--shadow);border-color:transparent}
.stack{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.wrap{flex-wrap:wrap}

/* buttons */
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:600;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--rose-soft);color:var(--rose)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.fab{position:fixed;z-index:15;bottom:calc(84px + env(safe-area-inset-bottom,0px));left:max(16px,calc(50% - 224px));
  border-radius:16px;padding:13px 18px;box-shadow:var(--shadow)}

/* chips & pills */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.p-open{background:var(--accent-soft);color:var(--accent)}
.p-taken{background:var(--sun-soft);color:var(--ink)}
.p-closed{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.p-high{background:var(--rose-soft);color:var(--rose)}
.p-mid{background:var(--sun-soft);color:var(--ink)}
.p-low{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.p-ok{background:var(--ok-soft);color:var(--ok)}

/* segmented */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:10px;padding:8px 6px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* bottom nav */
.nav{position:fixed;z-index:20;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 10px;font-size:11.5px;font-weight:500;color:var(--muted);position:relative}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--accent);font-weight:700}
.nav button[aria-current="page"]::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}

/* home */
.hello{display:flex;flex-direction:column;gap:2px}
.hello h1{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1.1}
.clock-card{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{width:118px;height:118px;position:relative;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .ct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.ring .ct b{font-size:26px;font-weight:700}
.ring .ct small{font-size:11px;color:var(--muted)}
.punch{width:100%;border:0;border-radius:14px;padding:14px;font-size:17px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.punch.out{background:var(--ink);color:var(--surface)}
.punch.done{background:var(--ok-soft);color:var(--ok)}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qa button{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px;font-weight:600;text-align:center;line-height:1.25}
.qa .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center}
.qa .ic svg{width:20px;height:20px}
.agenda-item{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.agenda-item:last-child{border-bottom:0}
.agenda-item .t{font-weight:700;font-size:14px}
.agenda-item .t small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.ag-body{border-inline-start:3px solid var(--accent);padding-inline-start:10px;min-width:0}
.ag-body b{display:block;font-size:14.5px}
.ag-body span{font-size:12.5px;color:var(--muted)}
.notice{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.notice:last-child{border-bottom:0}
.notice .when{font-size:12px;color:var(--muted)}

/* month grid */
.cal-head{display:flex;align-items:center;justify-content:space-between}
.cal-head b{font-family:var(--f-display);font-size:20px}
.cal-nav{display:flex;gap:6px}
.dow,.month{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.dow span{font-size:12px;color:var(--muted);font-weight:600;padding:4px 0}
.day{aspect-ratio:1/1.05;max-width:100%;border:1px solid transparent;border-radius:10px;background:var(--surface);font-size:14px;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative;padding:0}
.day.out{visibility:hidden}
.day.wkend{background:transparent;color:var(--muted)}
.day.today{border-color:var(--accent);font-weight:700}
.day[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.day .dots{display:flex;gap:2px;height:6px}
.day .dots i{width:5px;height:5px;border-radius:50%}
.day.typed{color:#fff;font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}

.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.kpi b{display:block;font-size:22px;font-weight:700;line-height:1.2}
.kpi span{font-size:12px;color:var(--muted)}
.typechips{display:flex;flex-wrap:wrap;gap:6px}

/* lists */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;background:none;border-inline:0;border-top:0;text-align:start}
.li:last-child{border-bottom:0}
.li .ttl{font-weight:600;font-size:14.5px}
.li .meta{font-size:12.5px;color:var(--muted)}
.li .lic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--accent-soft);color:var(--accent)}
.li .lic svg{width:19px;height:19px}
.chev{width:16px;height:16px;color:var(--muted);flex:none}

/* case cards */
.case{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;border-inline-start:4px solid var(--line)}
.case.u-high{border-inline-start-color:var(--rose)}
.case.u-mid{border-inline-start-color:var(--sun)}
.case h3{font-size:15.5px;font-weight:700}
.case p{margin:0;font-size:13.5px}
.kv{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted)}

/* rooms grid */
.daystrip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.daystrip::-webkit-scrollbar{display:none}
.dpick{flex:none;width:54px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 0;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.dpick small{font-size:11px;color:var(--muted)}
.dpick b{font-size:17px}
.dpick[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dpick[aria-pressed="true"] small{color:inherit;opacity:.8}
.rgrid-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.rgrid{display:grid;grid-template-columns:44px repeat(5,minmax(62px,1fr));min-width:360px}
.rgrid .h{position:sticky;top:0;background:var(--surface-2);font-size:11.5px;font-weight:700;text-align:center;padding:8px 2px;border-bottom:1px solid var(--line);line-height:1.2}
.rgrid .tm{font-size:11.5px;color:var(--muted);text-align:center;padding-top:6px;border-bottom:1px solid var(--line)}
.slot{border:0;border-bottom:1px solid var(--line);border-inline-start:1px solid var(--line);background:none;min-height:46px;padding:3px;font-size:11px;line-height:1.2;text-align:start;display:flex}
.slot span{flex:1;border-radius:8px;padding:4px 5px;overflow:hidden}
.slot.free span{display:grid;place-items:center;color:var(--line);font-size:18px}
.slot.free:hover span{background:var(--accent-soft);color:var(--accent)}
.slot.busy span{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.slot.mine span{background:var(--accent);color:var(--accent-ink);font-weight:600}
.slot.past{opacity:.45}

/* progress */
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}

/* info board */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .lbl{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.2px}
.tile .val{font-size:16px;font-weight:700;word-break:break-word;direction:ltr;text-align:right}
.tile .val.rtl{direction:rtl}
.tile .acts{display:flex;gap:6px;margin-top:auto}
.tile.wide{grid-column:1/-1}

/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(8,20,22,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease}
.sheet{width:100%;max-width:480px;max-height:88%;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
  padding-block:10px calc(18px + env(safe-area-inset-bottom,0px));animation:up .2s ease}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet h2{font-family:var(--f-display);font-size:22px;margin-bottom:12px}
form.f{display:flex;flex-direction:column;gap:12px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label,.fld .lb{font-size:13px;font-weight:600}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px 12px;width:100%;min-width:0}
.fld textarea{min-height:84px;resize:vertical}
.fld .hint{font-size:12px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:500;background:var(--surface-2)}
.privacy{display:flex;gap:8px;background:var(--sun-soft);border-radius:12px;padding:10px 12px;font-size:12.5px}
.toast{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.empty{text-align:center;color:var(--muted);font-size:13.5px;padding:18px 8px}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:360px){.qa{grid-template-columns:repeat(2,1fr)}.kpis{grid-template-columns:1fr 1fr}}
</style>

<div id="app" dir="rtl" lang="he">
  <header class="top">
    <button class="avatar" id="meAvatar" data-go="profile" aria-label="הפרופיל שלי"></button>
    <div class="brand"><b>המרחב</b><span id="stationName">שפ״ח · תחנת צפון</span></div>
    <button class="iconbtn" data-act="notifs" aria-label="התראות"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 9a6 6 0 1 1 12 0c0 5 2 6.5 2 6.5H4S6 14 6 9Z"/><path d="M10 19a2 2 0 0 0 4 0"/></svg><span class="badge" id="notifCount" hidden></span></button>
  </header>
  <div class="demo">גרסת הדגמה · כל השמות והנתונים לדוגמה בלבד</div>
  <main id="view"></main>
  <nav class="nav" aria-label="ניווט ראשי"><div class="nav-in" id="nav"></div></nav>
</div>

<script>
(function(){
document.documentElement.setAttribute('dir','rtl');
document.documentElement.setAttribute('lang','he');

/* ---------- helpers ---------- */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const isWork=d=>d.getDay()<=4;
const NOW=new Date(); const TODAY=iso(NOW);
const workdays=(from,n,dir=1)=>{const out=[];let d=new Date(from);while(out.length<n){if(isWork(d))out.push(iso(d));d=addDays(d,dir)}return out};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const DOW=['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];
const DOWL=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const fmtMonth=d=>new Intl.DateTimeFormat('he-IL',{month:'long',year:'numeric'}).format(d);
const fmtDay=s=>{const d=parse(s);return `יום ${DOWL[d.getDay()]}, ${d.getDate()}.${d.getMonth()+1}`};
const fmtShort=s=>{const d=parse(s);return `${d.getDate()}.${d.getMonth()+1}`};
const hebDate=d=>{try{return new Intl.DateTimeFormat('he-IL-u-ca-hebrew',{day:'numeric',month:'long',year:'numeric'}).format(d)}catch(e){return ''}};

/* ---------- derived ---------- */
function dayTypeFor(who,date){
  if(who===S.meId&&S.att[date])return S.att[date].type;
  const a=S.absences.find(x=>x.who===who&&date>=x.from&&date<=x.to);
  if(a)return a.type;
  if(date===TODAY&&S.team[who])return S.team[who].type;
  return null;
}
function myAgenda(date){
  const out=[];
  S.bookings.filter(b=>b.date===date&&b.by===S.meId).forEach(b=>out.push({t:`${pad(b.h)}:00`,end:`${pad(b.h+1)}:00`,title:b.what,sub:b.room,c:'var(--c-office)'}));
  S.sessions.filter(s=>s.date===date&&s.status!=='cancelled'&&(s.sup===S.meId||s.intern===S.meId)).forEach(s=>{
    if(s.room&&S.bookings.some(b=>b.date===date&&b.by===S.meId&&b.room===s.room&&`${pad(b.h)}:00`===s.start))return;
    out.push({t:s.start,end:hm(mins(s.start)+s.dur),title:`הדרכה · ${role()==='intern'?person(s.sup).name:person(s.intern).name}`,sub:s.room||s.mode,c:'var(--c-home)'});
  });
  S.events.filter(e=>e.date===date).forEach(e=>out.push({t:e.start,end:e.end,title:e.title,sub:e.place,c:EV_TYPES[e.type].c}));
  return out.sort((a,b)=>mins(a.t)-mins(b.t));
}
function notifs(){
  const n=[];
  if(role()!=='intern')S.sessions.filter(s=>s.sup===S.meId&&s.status==='requested').forEach(s=>n.push({go:'supervision',t:`${person(s.intern).name} ביקש/ה מפגש הדרכה`,s:fmtDay(s.date)+' · '+s.start}));
  S.pool.filter(p=>p.status==='open'&&p.urg==='high').forEach(p=>n.push({go:'pool',t:'פנייה דחופה פתוחה במאגר',s:p.inst+' · '+p.ref}));
  S.events.filter(e=>e.date>=TODAY&&!e.rsvp.includes(S.meId)).slice(0,3).forEach(e=>n.push({go:'events',t:`אישור הגעה: ${e.title}`,s:fmtDay(e.date)}));
  if(isWork(NOW)&&!(S.att[TODAY]&&S.att[TODAY].in)&&!dayTypeFor(S.meId,TODAY))n.push({go:'attendance',t:'עדיין לא דיווחת כניסה היום',s:'דיווח לוקח שנייה'});
  return n;
}

function monthGrid(month,cellFn){
  const first=new Date(month.getFullYear(),month.getMonth(),1);const days=new Date(month.getFullYear(),month.getMonth()+1,0).getDate();
  let cells='';for(let i=0;i<first.getDay();i++)cells+='<span class="day out"></span>';
  for(let d=1;d<=days;d++)cells+=cellFn(iso(new Date(month.getFullYear(),month.getMonth(),d)));
  return `<div class="dow">${DOW.map(x=>`<span>${x}</span>`).join('')}</div><div class="month">${cells}</div>`;
}

/* ---------- render ---------- */
function render(){
  const v=UI.view;
  const map={home:vHome,attendance:vAttendance,calendar:vCalendar,cases:vCases,more:vMore,files:vFiles,library:vLibrary,info:vInfo,contacts:vContacts,notices:vNotices,profile:vProfile};
  document.getElementById('view').innerHTML=(map[v]||vHome)();
  const active=PARENT[v]||v;
  document.getElementById('nav').innerHTML=TABS.map(t=>`<button data-go="${t.k}" ${active===t.k?'aria-current="page"':''}>${ic(t.i)}<span>${t.l}</span></button>`).join('');
  const m=me();document.getElementById('meAvatar').textContent=initials(m.name);
  const n=notifs().length;const b=document.getElementById('notifCount');b.hidden=!n;b.textContent=n;
}

/* ---------- sheet & toast ---------- */
let sheetSubmit=null;
function sheet(title,html,onSubmit,submitLabel='שמירה'){
  closeSheet();
  const d=document.createElement('div');d.className='scrim';d.id='scrim';
  d.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="grab"></div><h2>${esc(title)}</h2>${onSubmit?`<form class="f" id="sheetForm">${html}<div class="row"><button class="btn grow" type="submit">${submitLabel}</button><button class="btn ghost" type="button" data-act="closeSheet">ביטול</button></div></form>`:html}</div>`;
  document.body.appendChild(d);sheetSubmit=onSubmit;
  d.addEventListener('click',e=>{if(e.target===d)closeSheet()});
  const f=d.querySelector('#sheetForm');if(f)f.addEventListener('submit',e=>{e.preventDefault();const data=Object.fromEntries(new FormData(f));data._all=new FormData(f);if(sheetSubmit(data,f)!==false){closeSheet();save();render()}});
  const first=d.querySelector('input,select,textarea,button');if(first)first.focus({preventScroll:true});
}
function closeSheet(){const d=document.getElementById('scrim');if(d)d.remove()}
let tt;function toast(msg){let t=document.querySelector('.toast');if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent=msg;clearTimeout(tt);tt=setTimeout(()=>t.remove(),2400)}
const opt=(arr,sel)=>arr.map(x=>{const [v,l]=Array.isArray(x)?x:[x,x];return `<option value="${esc(v)}" ${v===sel?'selected':''}>${esc(l)}</option>`}).join('');
const fld=(label,inner,hint)=>`<div class="fld"><label>${label}</label>${inner}${hint?`<span class="hint">${hint}</span>`:''}</div>`;
const roomFree=(room,date,h,ignoreId)=>!S.bookings.some(b=>b.room===room&&b.date===date&&b.h===h&&b.id!==ignoreId);

function formAbsence(pre){
  sheet('דיווח היעדרות',`
    ${fld('סוג','<select name="type" id="abType">'+opt(ABS_TYPES.map(k=>[k,DAY_TYPES[k].l]),pre&&pre.type)+'</select>')}
    <div class="two">${fld('מתאריך',`<input type="date" name="from" id="abFrom" required value="${pre&&pre.from||TODAY}">`)}${fld('עד תאריך',`<input type="date" name="to" id="abTo" required value="${pre&&pre.to||TODAY}">`)}</div>
    ${fld('אישור (אישור מחלה, צו מילואים)','<input type="file" name="file" id="abFile" accept="image/*,.pdf">','בגרסה המלאה הקובץ נשמר בתיק העובד')}
    ${fld('הערה','<input name="note" id="abNote" placeholder="לא חובה">')}`,d=>{
      if(d.to<d.from){toast('תאריך הסיום מוקדם מתאריך ההתחלה');return false}
      const file=d.file&&d.file.name?d.file.name:'';
      S.absences.push({id:uid(),who:S.meId,type:d.type,from:d.from,to:d.to,note:d.note,file});
      for(let x=parse(d.from);iso(x)<=d.to;x=addDays(x,1))delete S.att[iso(x)];
      toast(`${DAY_TYPES[d.type].l} דווחה`);
    },'דיווח');
}

function formSession(pre){
  const isIntern=role()==='intern';
  const interns=S.staff.filter(p=>p.role==='intern'&&p.supervisor===(isIntern?me().supervisor:S.meId));
  const d0=pre&&pre.date||workdays(addDays(NOW,1),1)[0];
  sheet(isIntern?'בקשת מפגש הדרכה':'קביעת מפגש הדרכה',`
    ${isIntern?`<div class="sub">הבקשה תישלח ל${esc(person(me().supervisor).name)} לאישור.</div>`:fld('מתמחה','<select name="intern" id="sIntern">'+opt(interns.map(p=>[p.id,p.name]))+'</select>')}
    <div class="two">${fld('תאריך',`<input type="date" name="date" id="sDate" required value="${d0}" min="${TODAY}">`)}${fld('שעה','<select name="start" id="sStart">'+opt(HOURS.map(h=>`${pad(h)}:00`),'12:00')+'</select>')}</div>
    <div class="two">${fld('משך','<select name="dur" id="sDur">'+opt([['45','45 דק׳'],['60','שעה'],['90','שעה וחצי']],'60')+'</select>')}${fld('אופן','<select name="mode" id="sMode">'+opt(['פנים אל פנים','זום'])+'</select>')}</div>
    ${fld('חדר','<select name="room" id="sRoom">'+opt([['','בלי חדר'],...ROOMS.map(r=>[r,r])],'חדר הדרכה')+'</select>','החדר יוזמן אוטומטית אם הוא פנוי')}
    ${fld('נושא / סדר יום','<textarea name="topic" id="sTopic" placeholder="למשל: הכנת הצגת מקרה, קריאת פרוטוקול אבחון"></textarea>')}`,d=>{
      const h=Number(d.start.slice(0,2));const hrs=Math.ceil(Number(d.dur)/60);
      const room=d.mode==='זום'?'':d.room;
      if(room)for(let i=0;i<hrs;i++)if(!roomFree(room,d.date,h+i)){toast(`${room} תפוס ב-${pad(h+i)}:00. בחרו שעה או חדר אחרים`);return false}
      const s={id:uid(),intern:isIntern?S.meId:d.intern,sup:isIntern?me().supervisor:S.meId,date:d.date,start:d.start,dur:Number(d.dur),mode:d.mode,room,topic:d.topic,status:isIntern?'requested':'scheduled',notes:''};
      S.sessions.push(s);
      if(room&&!isIntern)for(let i=0;i<hrs;i++)S.bookings.push({id:uid(),room,date:d.date,h:h+i,by:S.meId,what:'הדרכת מתמחה',session:s.id});
      toast(isIntern?'הבקשה נשלחה':'המפגש נקבע'+(room&&!isIntern?' והחדר הוזמן':''));
    },isIntern?'שליחת בקשה':'קביעה');
}
function sessionSheet(id){
  const s=S.sessions.find(x=>x.id===id);const isSup=s.sup===S.meId;
  const btns=[];
  if(isSup&&s.status==='requested')btns.push(`<button class="btn" data-act="approveSession" data-id="${id}">אישור המפגש</button>`);
  if(isSup&&s.status==='scheduled')btns.push(`<button class="btn" data-act="doneSession" data-id="${id}">סימון שהתקיים</button>`);
  if(s.status!=='done'&&s.status!=='cancelled')btns.push(`<button class="btn danger" data-act="cancelSession" data-id="${id}">ביטול</button>`);
  sheet('מפגש הדרכה',`<div class="stack">
    <div class="kv" style="font-size:14px;color:var(--ink)"><span>מתמחה: <b>${esc(person(s.intern).name)}</b></span><span>מדריכה: <b>${esc(person(s.sup).name)}</b></span></div>
    <div class="sub num">${fmtDay(s.date)} · ${s.start} · ${s.dur} דק׳ · ${esc(s.room||s.mode)}</div>
    ${s.topic?`<div><b>נושא:</b> ${esc(s.topic)}</div>`:''}
    ${s.notes?`<div><b>סיכום:</b> ${esc(s.notes)}</div>`:''}
    <div class="row wrap">${btns.join('')}<button class="btn ghost" data-act="closeSheet">סגירה</button></div></div>`);
}
function formBook(room,h){
  sheet('הזמנת חדר',`<div class="sub num">${esc(room)} · ${fmtDay(UI.roomDay)}</div>
    <div class="two">${fld('משעה','<select name="h" id="bH">'+opt(HOURS.map(x=>[String(x),`${pad(x)}:00`]),String(h))+'</select>')}${fld('משך','<select name="n" id="bN">'+opt([['1','שעה'],['2','שעתיים'],['3','3 שעות']],'1')+'</select>')}</div>
    ${fld('מטרה','<select name="what" id="bWhat">'+opt(['טיפול','טיפול במשחק','שיחת הורים','אבחון','הדרכת מתמחה','ישיבה'])+'</select>','בלי שמות מטופלים')}`,d=>{
      const h0=Number(d.h),n=Number(d.n);
      for(let i=0;i<n;i++){if(h0+i>HOURS[HOURS.length-1]||!roomFree(room,UI.roomDay,h0+i)){toast(`החדר תפוס או סגור ב-${pad(h0+i)}:00`);return false}}
      for(let i=0;i<n;i++)S.bookings.push({id:uid(),room,date:UI.roomDay,h:h0+i,by:S.meId,what:d.what});
      toast(`${room} הוזמן`);
    },'הזמנה');
}

/* ---------- actions ---------- */
const A={
  punchIn(){const a=S.att[TODAY]||{type:'office'};a.in=nowHM();a.out='';if(!a.type||DAY_TYPES[a.type].absence)a.type='office';S.att[TODAY]=a;toast(`כניסה נרשמה ב-${a.in}`)},
  punchOut(){S.att[TODAY].out=nowHM();toast(`יציאה נרשמה ב-${S.att[TODAY].out}`)},
  editToday(){formDay(TODAY);return 1},
  pickType(){pickType();return 1},
  setType(el){const a=S.att[TODAY]||{in:'',out:''};a.type=el.dataset.k;S.att[TODAY]=a;closeSheet();toast(DAY_TYPES[a.type].l)},
  addAbsence(){formAbsence();return 1},
  delAbs(el){S.absences=S.absences.filter(a=>a.id!==el.dataset.id);toast('ההיעדרות בוטלה')},
  attDay(el){formDay(el.dataset.d);return 1},
  attPrev(){UI.attMonth=new Date(UI.attMonth.getFullYear(),UI.attMonth.getMonth()-1,1)},
  attNext(){UI.attMonth=new Date(UI.attMonth.getFullYear(),UI.attMonth.getMonth()+1,1)},
  calPrev(){UI.calMonth=new Date(UI.calMonth.getFullYear(),UI.calMonth.getMonth()-1,1)},
  calNext(){UI.calMonth=new Date(UI.calMonth.getFullYear(),UI.calMonth.getMonth()+1,1)},
  calDay(el){UI.calDay=el.dataset.d},
  calTab(el){UI.calTab=el.dataset.k},
  caseTab(el){UI.caseTab=el.dataset.k},
  rsvp(el){const e=S.events.find(x=>x.id===el.dataset.id);const i=e.rsvp.indexOf(S.meId);if(i>=0){e.rsvp.splice(i,1);toast('ההגעה בוטלה')}else{e.rsvp.push(S.meId);toast('נרשמת לאירוע')}},
  addEvent(){formEvent();return 1},
  roomDay(el){UI.roomDay=el.dataset.d},
  book(el){formBook(el.dataset.room,Number(el.dataset.h));return 1},
  booking(el){const b=S.bookings.find(x=>x.id===el.dataset.id);const p=person(b.by);
    sheet(`${b.room} · ${pad(b.h)}:00`,`<div class="stack"><div><b>${esc(p.name)}</b> · ${esc(b.what)}</div><div class="sub">${fmtDay(b.date)}</div><div class="row">${b.by===S.meId?`<button class="btn danger" data-act="cancelBooking" data-id="${b.id}">ביטול ההזמנה</button>`:''}<button class="btn ghost" data-act="closeSheet">סגירה</button></div></div>`);return 1},
  cancelBooking(el){S.bookings=S.bookings.filter(b=>b.id!==el.dataset.id);closeSheet();toast('ההזמנה בוטלה')},
  goRooms(){go('rooms');return 1},goFiles(){go('files');return 1},
  addSession(){formSession();return 1},
  session(el){sessionSheet(el.dataset.id);return 1},
  approveSession(el){const s=S.sessions.find(x=>x.id===el.dataset.id);const h=Number(s.start.slice(0,2));const hrs=Math.ceil(s.dur/60);
    if(s.room){for(let i=0;i<hrs;i++)if(!roomFree(s.room,s.date,h+i)){s.room='';break}if(s.room)for(let i=0;i<hrs;i++)S.bookings.push({id:uid(),room:s.room,date:s.date,h:h+i,by:S.meId,what:'הדרכת מתמחה',session:s.id})}
    s.status='scheduled';closeSheet();toast(s.room?'המפגש אושר והחדר הוזמן':'המפגש אושר. החדר תפוס, כדאי לבחור חדר אחר')},
  doneSession(el){const s=S.sessions.find(x=>x.id===el.dataset.id);
    sheet('סיכום מפגש',fld('מה עלה במפגש (לא חובה)','<textarea name="notes" id="snNotes"></textarea>')+fld('משך בפועל (דק׳)',`<input type="number" name="dur" id="snDur" value="${s.dur}" min="15" step="15">`),d=>{s.status='done';s.notes=d.notes;s.dur=Number(d.dur)||s.dur;toast('נרשם ביומן ההדרכה')},'שמירה');return 1},
  cancelSession(el){const s=S.sessions.find(x=>x.id===el.dataset.id);s.status='cancelled';S.bookings=S.bookings.filter(b=>b.session!==s.id);closeSheet();toast('המפגש בוטל')},
  setTarget(){sheet('יעד שעות הדרכה',fld('שעות ליעד',`<input type="number" name="t" id="tgt" value="${S.internTarget}" min="1">`,'מגדירים לפי דרישות ההתמחות של כל מתמחה'),d=>{S.internTarget=Number(d.t)||S.internTarget});return 1},
  poolFilter(el){UI.poolFilter=el.dataset.k},
  addPool(){formPool();return 1},
  takeCase(el){const p=S.pool.find(x=>x.id===el.dataset.id);p.status='taken';p.assignee=S.meId;toast('הפנייה אצלך')},
  closeCase(el){const p=S.pool.find(x=>x.id===el.dataset.id);p.status='closed';toast('הפנייה סומנה כטופלה')},
  releaseCase(el){const p=S.pool.find(x=>x.id===el.dataset.id);p.status='open';p.assignee='';toast('הפנייה חזרה למאגר')},
  addEmergency(){formEmergency();return 1},
  closeEm(el){const e=S.emergencies.find(x=>x.id===el.dataset.id);e.status='נסגר';toast('האירוע נסגר')},
  fileCat(el){UI.fileCat=el.dataset.k},
  libKind(el){UI.libKind=el.dataset.k},
  libItem(el){const x=S.lib.find(i=>i.id===el.dataset.id);
    const txt=x.title+'\n'+x.aud+' · '+x.fmt+'\n'+x.outline.map((o,i)=>(i+1)+'. '+o).join('\n');
    sheet(x.title,`<div class="stack"><div class="row wrap"><span class="pill p-open">${esc(x.kind)}</span></div>
      <div class="kv" style="font-size:13.5px"><span>קהל: <b>${esc(x.aud)}</b></span><span>מבנה: <b>${esc(x.fmt)}</b></span></div>
      ${x.goals?`<div><b>מטרות:</b> ${esc(x.goals)}</div>`:''}
      <div class="card" style="background:var(--surface-2)"><b>מהלך המפגשים</b><ol style="margin:6px 0 0;padding-inline-start:20px;display:flex;flex-direction:column;gap:4px">${x.outline.map(o=>`<li>${esc(o)}</li>`).join('')}</ol></div>
      <div class="row wrap"><button class="btn grow" data-act="copy" data-v="${esc(txt)}">העתקת המבנה</button>${x.by===S.meId?`<button class="btn danger" data-act="delLib" data-id="${x.id}">מחיקה</button>`:''}<button class="btn ghost" data-act="closeSheet">סגירה</button></div></div>`);return 1},
  addLib(){sheet('מבנה חדש למאגר',`${fld('סוג','<select name="kind" id="lKind">'+opt(['קבוצה טיפולית','סדנה','הרצאה'])+'</select>')}${fld('שם','<input name="title" id="lTitle" required>')}${fld('קהל יעד','<input name="aud" id="lAud" required placeholder="למשל: הורים לילדי גן">')}${fld('מבנה','<input name="fmt" id="lFmt" required placeholder="למשל: 6 מפגשים × 45 דק׳">')}${fld('מטרות','<input name="goals" id="lGoals">')}${fld('מהלך המפגשים','<textarea name="outline" id="lOutline" required placeholder="שורה לכל מפגש או חלק"></textarea>')}`,d=>{
    S.lib.unshift({id:uid(),by:S.meId,kind:d.kind,title:d.title,aud:d.aud,fmt:d.fmt,goals:d.goals,outline:d.outline.split('\n').map(x=>x.trim()).filter(Boolean)});UI.libKind='הכל';toast('נוסף למאגר')},'הוספה');return 1},
  delLib(el){S.lib=S.lib.filter(x=>x.id!==el.dataset.id);closeSheet();toast('נמחק')},
  file(el){fileSheet(el.dataset.id);return 1},
  addFile(){formFile();return 1},
  reveal(el){UI.revealed[el.dataset.id]=!UI.revealed[el.dataset.id]},
  copy(el){const v=el.dataset.v;const ok=()=>toast('הועתק');
    try{navigator.clipboard.writeText(v).then(ok,()=>toast(v))}catch(e){toast(v)}return 1},
  editInfo(el){formInfo(el.dataset.id);return 1},
  delInfo(el){S.info=S.info.filter(i=>i.id!==el.dataset.id);closeSheet();toast('הפריט נמחק')},
  addNotice(){formNotice();return 1},
  notifs(){notifSheet();return 1},
  switchMe(el){S.meId=el.dataset.id;toast(`מוצגת כעת: ${person(S.meId).name}`)},
  reset(){sheet('לאפס את נתוני ההדגמה?','<div class="stack"><div class="sub">כל מה שהוספת יימחק והדוגמאות יחזרו.</div><div class="row"><button class="btn danger grow" data-act="doReset">איפוס</button><button class="btn ghost" data-act="closeSheet">ביטול</button></div></div>');return 1},
  doReset(){S=seed();closeSheet();toast('הנתונים אופסו')},
  closeSheet(){closeSheet();return 1},
};
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){e.preventDefault();closeSheet();go(g.dataset.go);return}
  const a=e.target.closest('[data-act]');if(!a||!A[a.dataset.act])return;
  e.preventDefault();
  const noRender=A[a.dataset.act](a);
  if(!noRender){save();render()}
});

/* ---------- boot ---------- */
const h=(location.hash||'').slice(1);
if(h&&['home','attendance','calendar','cases','more','files','library','info','contacts','notices','profile','rooms','supervision','events','pool','emergency'].includes(h))go(h);else render();
setInterval(()=>{if(UI.view==='home'&&!document.getElementById('scrim'))render()},60000);
})();
</script>

</html>
